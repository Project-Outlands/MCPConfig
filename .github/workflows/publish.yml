name: Publish

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: 'Maven version timestamp (yyyyMMdd.HHmmss; defaults to current UTC time)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mcp-config-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculate version
        id: version
        env:
          REQUESTED_TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          timestamp="${REQUESTED_TIMESTAMP:-$(date -u +%Y%m%d.%H%M%S)}"
          if [[ ! "$timestamp" =~ ^[0-9]{8}\.[0-9]{6}$ ]]; then
            echo '::error::Timestamp must have the format yyyyMMdd.HHmmss'
            exit 1
          fi
          echo "MCP_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew makeZip --no-daemon

      - name: Publish to Maven
        run: |
          : "${MAVEN_USER:?Set the OUTLANDS_MAVEN_USER repository secret}"
          : "${MAVEN_PASSWORD:?Set the OUTLANDS_MAVEN_PASSWORD repository secret}"
          ./gradlew publish --no-daemon --no-configuration-cache
        env:
          MAVEN_USER: ${{ secrets.OUTLANDS_MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.OUTLANDS_MAVEN_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mcp-config-${{ steps.version.outputs.timestamp }}
          target_commitish: ${{ github.sha }}
          name: MCPConfig ${{ steps.version.outputs.timestamp }}
          generate_release_notes: true
          files: build/distributions/mcp_config-*-${{ steps.version.outputs.timestamp }}.zip
          fail_on_unmatched_files: true

      - name: Upload ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: mcp-config
          path: build/distributions/mcp_config-*-${{ steps.version.outputs.timestamp }}.zip
          if-no-files-found: error
