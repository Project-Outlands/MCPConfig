// MCPConfig -- builds and publishes the mcp_config zip consumed by Mavenizer / ForgeDev.
//
//   ./gradlew makeZip                                  assemble only
//   ./gradlew publish -PmavenUser=... -PmavenPassword=...
//   ./gradlew publish -PmcpTimestamp=20261022.130000    pin the version (idempotent re-runs)
//   ./gradlew publish -PmcpVersion=1.12.2-...           pin the whole version
//   ./gradlew publish -PmavenUrl=file:///tmp/mcprepo    local sandbox
//
// Everything else (decompile / mcinject / project scaffolding / mojmap bridging) was removed:
// this repo only owns the mapping+patch configuration, the patched sources are built by the
// loader project itself.

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        maven { url = 'https://maven.outlands.top/releases/' }
    }
    dependencies {
        classpath 'net.minecraftforge:srgutils:0.2.12'
    }
}

import groovy.json.JsonBuilder
import groovy.json.JsonSlurper
import net.minecraftforge.lex.ExtractInheritance
import net.minecraftforge.mcpconfig.tasks.*
import net.minecraftforge.srgutils.IMappingFile

plugins {
    id 'de.undercouch.download' version '5.7.0'
}

apply plugin: 'maven-publish'

group = 'de.oceanlabs.mcp'

ext {
    // Version suffix of the publication. Pinning it makes re-running publish idempotent.
    TIMESTAMP = providers.gradleProperty('mcpTimestamp')
            .orElse(providers.environmentVariable('MCP_TIMESTAMP'))
            .getOrElse(new Date().format('yyyyMMdd.HHmmss'))
    MAVEN_URL = providers.gradleProperty('mavenUrl')
            .orElse(providers.environmentVariable('MAVEN_URL'))
            .getOrElse('https://maven.outlands.top/releases')
    MAVEN_USER = providers.gradleProperty('mavenUser')
            .orElse(providers.environmentVariable('MAVEN_USER'))
            .orNull
    MAVEN_PASSWORD = providers.gradleProperty('mavenPassword')
            .orElse(providers.environmentVariable('MAVEN_PASSWORD'))
            .orNull
}

static def mavenPath(dep) {
    if (dep == null)
        return null
    def ext = 'jar'
    def idx = dep.indexOf('@')
    if (idx != -1) {
        ext = dep.substring(idx + 1)
        dep = dep.substring(0, idx)
    }
    def pts = dep.split(':')
    return pts[0].replace('.', '/') + '/' + pts[1] + '/' + pts[2] + '/' + pts[1] + '-' + pts[2] + (pts.length > 3 ? '-' + pts[3] : '') + '.' + ext
}

tasks.register('downloadVersionManifest', Download) {
    src 'https://launchermeta.mojang.com/mc/game/version_manifest.json'
    dest layout.buildDirectory.file('versions/version_manifest.json')
    overwrite true
    retries 5
    connectTimeout 30000
    readTimeout 120000
    doLast {
        def manifest = downloadVersionManifest.dest
        manifest.write(new JsonBuilder(new JsonSlurper().parseText(manifest.text)).toPrettyString())
    }
}

tasks.register('makeZip') {
    group = 'build'
    description = 'Assembles the mcp_config distribution for every version project.'
    dependsOn { subprojects.collect { "${it.path}:makeZip" } }
}

tasks.named('publish') {
    group = 'publishing'
    description = 'Publishes mcp_config for every version project.'
    dependsOn { subprojects.collect { "${it.path}:publish" } }
}

tasks.register('clean', Delete) {
    group = 'build'
    description = 'Deletes the cached downloads and assembled distributions.'
    delete layout.buildDirectory
}

subprojects {
    apply plugin: 'base'
    apply plugin: 'de.undercouch.download'
    apply plugin: 'maven-publish'

    group = rootProject.group
    version = name

    ext {
        FORGE_MAVEN = 'https://files.minecraftforge.net/maven/'
        PATH_BUILD = rootProject.file('build').absolutePath
        PATH_VERSION = project.projectDir.absolutePath + '/'
        PATH_DISTRO = PATH_BUILD + '/distributions'
        PATH_CACHED_LIBRARIES = PATH_BUILD + '/libraries/'
        PATH_CACHED_VERSIONS = PATH_BUILD + '/versions/'
        PATH_CACHED_VERSION = PATH_CACHED_VERSIONS + project.version + '/'
        PATH_CACHED_VERSION_DATA = PATH_CACHED_VERSION + 'data/'
        PATH_INJECT = file('inject').exists() ? file('inject') : null
        PATH_TSRG = PATH_VERSION + 'joined.tsrg'
        PATH_CTRS = PATH_VERSION + 'constructors.txt'

        CONFIG = file('config.json').exists() ? new JsonSlurper().parse(file('config.json')) : [:]
        MERGETOOL = [
            version: CONFIG.get('merge', [:]).version,
            args: CONFIG.get('merge', [:]).get('args', []),
            jvmargs: CONFIG.get('merge', [:]).get('jvmargs', []),
            path: mavenPath(CONFIG.get('merge', [:]).version),
            repo: CONFIG.get('merge', [:]).get('repo', FORGE_MAVEN)
        ]
    }

    // Mojang's CDNs like to drop connections now and then; retry instead of failing a whole build.
    def downloadFile = { Object url, Object target ->
        download.run {
            src url
            dest target
            overwrite false
            retries 5
            connectTimeout 30000
            readTimeout 120000
        }
    }

    def publishVersion = providers.gradleProperty('mcpVersion')
            .getOrElse("${project.version}-${rootProject.TIMESTAMP}".toString())

    // ---------------------------------------------------------------- downloads
    tasks.register('downloadJson', SingleFileOutput) {
        dependsOn rootProject.downloadVersionManifest
        inputs.file rootProject.downloadVersionManifest.dest
        dest file(PATH_CACHED_VERSION + 'version.json')
        doLast {
            def manifest = new JsonSlurper().parseText(inputs.files.singleFile.text)
            def entry = manifest.versions.find { it.id == project.version }
            def url = entry?.url ?: "https://s3.amazonaws.com/Minecraft.Download/versions/${project.version}/${project.version}.json"
            downloadFile(url, downloadJson.dest)
            downloadJson.dest.write(new JsonBuilder(new JsonSlurper().parseText(downloadJson.dest.text)).toPrettyString())
        }
    }

    tasks.register('downloadClient', SingleFileOutput) {
        dependsOn downloadJson
        inputs.file downloadJson.dest
        dest file(PATH_CACHED_VERSION + 'client.jar')
        doLast {
            def json = new JsonSlurper().parseText(inputs.files.singleFile.text)
            downloadFile(json.downloads.client.url, downloadClient.dest)
        }
    }

    tasks.register('downloadServer', SingleFileOutput) {
        dependsOn downloadJson
        inputs.file downloadJson.dest
        dest file(PATH_CACHED_VERSION + 'server.jar')
        doLast {
            def json = new JsonSlurper().parseText(inputs.files.singleFile.text)
            downloadFile(json.downloads.server.url, downloadServer.dest)
        }
    }

    tasks.register('downloadLibraries') {
        dependsOn downloadJson
        inputs.file downloadJson.dest
        doLast {
            def json = new JsonSlurper().parseText(downloadJson.dest.text)
            json.libraries.each { lib ->
                def artifacts = (lib.downloads.artifact == null ? [] : [lib.downloads.artifact]) + lib.downloads.get('classifiers', [:]).values()
                artifacts.each { art ->
                    def target = file(PATH_CACHED_LIBRARIES + art.path)
                    if (!target.exists())
                        downloadFile(art.url, target)
                }
            }
            CONFIG.get('libraries', [:]).each { side, libs ->
                libs.each { art ->
                    def path = mavenPath(art)
                    def target = file(PATH_CACHED_LIBRARIES + path)
                    if (!target.exists())
                        downloadFile(FORGE_MAVEN + path, target)
                }
            }
        }
    }

    tasks.register('downloadMergeTool', Download) {
        inputs.property('url', MERGETOOL.repo + MERGETOOL.path)
        src MERGETOOL.repo + MERGETOOL.path
        dest file(PATH_CACHED_LIBRARIES + MERGETOOL.path)
        overwrite false
    }

    // ------------------------------------------------------------ jar pipeline
    // Only used to compute the inheritance metadata that the access/static/override
    // dumps are derived from; nothing here ends up in the zip.
    tasks.register('filterClient', Zip) {
        dependsOn downloadClient
        archiveFileName = 'client.slim.jar'
        destinationDirectory = file(PATH_CACHED_VERSION)
        from zipTree(downloadClient.dest)
        IMappingFile.load(file(PATH_TSRG)).classes.each { include it.original + '.class' }
    }

    tasks.register('filterServer', Zip) {
        dependsOn downloadServer
        archiveFileName = 'server.slim.jar'
        destinationDirectory = file(PATH_CACHED_VERSION)
        from zipTree(downloadServer.dest)
        IMappingFile.load(file(PATH_TSRG)).classes.each { include it.original + '.class' }
    }

    tasks.register('mergeJars', MergeJar) {
        dependsOn downloadMergeTool, filterClient, filterServer
        jar downloadMergeTool.dest
        jvmArgs MERGETOOL.jvmargs
        client filterClient.archiveFile.get().getAsFile()
        server filterServer.archiveFile.get().getAsFile()
        version project.version
        dest file(PATH_CACHED_VERSION + 'joined.jar')
        args MERGETOOL.args
    }

    tasks.register('extractInheritance', ExtractInheritance) {
        dependsOn downloadLibraries, mergeJars
        input mergeJars.dest
        inputs.file downloadJson.dest
        dest file(PATH_CACHED_VERSION_DATA + 'inheritance.json')
        doFirst {
            def json = new JsonSlurper().parseText(downloadJson.dest.text)
            json.libraries.stream().map { it?.downloads?.artifact?.path }.findAll { it != null }.each { addLibrary(file(PATH_CACHED_LIBRARIES + it)) }
        }
    }

    tasks.register('makeSRG', SingleFileOutput) {
        inputs.file(PATH_TSRG)
        dest file(PATH_CACHED_VERSION_DATA + 'joined.srg')
        doLast {
            IMappingFile.load(inputs.files.singleFile).write(dest.toPath(), IMappingFile.Format.SRG, false)
        }
    }

    tasks.register('fixAccessLevels', CreateAccessFixes) {
        dependsOn extractInheritance
        srg file(PATH_TSRG)
        meta extractInheritance.dest
        dest file(PATH_CACHED_VERSION_DATA + 'access.txt')
    }

    tasks.register('dumpOverrides', DumpOverrides) {
        dependsOn extractInheritance, makeSRG
        srg makeSRG.dest
        meta extractInheritance.dest
        dest file(PATH_CACHED_VERSION_DATA + 'overrides.txt')
    }

    tasks.register('dumpStatic', DumpStatics) {
        dependsOn extractInheritance, makeSRG
        srg makeSRG.dest
        meta extractInheritance.dest
        dest file(PATH_CACHED_VERSION_DATA + 'static_methods.txt')
    }

    tasks.register('makeExceptions', DumpExceptions) {
        dependsOn extractInheritance, makeSRG
        exec file('exceptions.txt').exists() ? file('exceptions.txt') : rootProject.file('config/exceptions.txt')
        srg makeSRG.dest
        meta extractInheritance.dest
        dest file(PATH_CACHED_VERSION_DATA + 'exceptions.txt')
    }

    // ------------------------------------------------------------- distribution
    // config.json describes the full pipeline for consumers (decompile/mcinject/process
    // function blocks included) even though this repo no longer executes those steps.
    //
    // Function blocks are normalized so every consumer gets args/jvmargs/repo: Mavenizer's
    // MCPTaskFactory iterates func.jvmargs unconditionally, so a missing key is a hard crash.
    def functionConfig = { Map raw ->
        def out = new LinkedHashMap()
        out.version = raw.version
        if (raw.containsKey('java_version'))
            out.java_version = raw.java_version
        out.args = raw.containsKey('args') ? raw.args : []
        out.jvmargs = raw.containsKey('jvmargs') ? raw.jvmargs : []
        out.repo = raw.containsKey('repo') ? raw.repo : FORGE_MAVEN
        return out
    }

    tasks.register('generateConfiguration', SingleFileOutput) {
        inputs.property('config', CONFIG)
        dest file(PATH_CACHED_VERSION_DATA + 'config.json')

        doLast {
            def json = new JsonBuilder()
            def steps_def = [
                joined: [
                    [type: 'downloadManifest'],
                    [type: 'downloadJson'],
                    [type: 'downloadClient'],
                    [type: 'downloadServer'],
                    [type: 'strip', name: 'stripClient', input: '{downloadClientOutput}'],
                    [type: 'strip', name: 'stripServer', input: '{downloadServerOutput}'],
                    [type: 'merge', client: '{stripClientOutput}', server: '{stripServerOutput}', version: project.version],
                    [type: 'rename', input: '{mergeOutput}'],
                    [type: 'mcinject', input: '{renameOutput}'],
                    [type: 'listLibraries'],
                    [type: 'decompile', libraries: '{listLibrariesOutput}', input: '{mcinjectOutput}'],
                    [type: 'inject', input: '{decompileOutput}'],
                    [type: 'patch', input: '{injectOutput}']
                ],
                client: [
                    [type: 'downloadManifest'],
                    [type: 'downloadJson'],
                    [type: 'downloadClient'],
                    [type: 'strip', input: '{downloadClientOutput}'],
                    [type: 'rename', input: '{stripOutput}'],
                    [type: 'mcinject', input: '{renameOutput}'],
                    [type: 'listLibraries'],
                    [type: 'decompile', libraries: '{listLibrariesOutput}', input: '{mcinjectOutput}'],
                    [type: 'inject', input: '{decompileOutput}'],
                    [type: 'patch', input: '{injectOutput}']
                ],
                server: [
                    [type: 'downloadManifest'],
                    [type: 'downloadJson'],
                    [type: 'downloadServer'],
                    [type: 'strip', input: '{downloadServerOutput}'],
                    [type: 'rename', input: '{stripOutput}'],
                    [type: 'mcinject', input: '{renameOutput}'],
                    [type: 'listLibraries'],
                    [type: 'decompile', libraries: '{listLibrariesOutput}', input: '{mcinjectOutput}'],
                    [type: 'inject', input: '{decompileOutput}'],
                    [type: 'patch', input: '{injectOutput}']
                ]
            ]
            json {
                spec 4
                version project.version
                java_target CONFIG.get('java_target', 8)
                encoding "UTF-8"
                data {
                    access 'config/access.txt'
                    constructors 'config/constructors.txt'
                    exceptions 'config/exceptions.txt'
                    mappings 'config/joined.tsrg'
                    inject 'config/inject/'
                    statics 'config/static_methods.txt'
                    patches {
                        client 'patches/client/'
                        joined 'patches/joined/'
                        server 'patches/server/'
                    }
                }
                steps steps_def
                if (CONFIG.get('process', null) != null) {
                    steps_def.each { side, list ->
                        list.add([type: 'process', input: '{patchOutput}'])
                    }
                }
                functions {
                    decompile functionConfig(CONFIG.fernflower)
                    mcinject functionConfig(CONFIG.mcinjector)
                    merge functionConfig(CONFIG.merge)
                    rename functionConfig(CONFIG.rename)
                    if (CONFIG.containsKey('process'))
                        process functionConfig(CONFIG.process)
                }
                libraries CONFIG.libraries
            }
            dest.write(json.toPrettyString())
        }
    }

    def mcpZip = tasks.register('makeZip', Zip) {
        group = 'build'
        description = 'Assembles the mcp_config distribution zip.'
        dependsOn generateConfiguration, makeSRG, dumpOverrides, dumpStatic, fixAccessLevels, makeExceptions

        archiveBaseName = 'mcp_config'
        archiveVersion = publishVersion
        archiveExtension = 'zip'
        destinationDirectory = file(PATH_DISTRO)

        from generateConfiguration
        from(fixAccessLevels) { into 'config/' }
        from(file(PATH_CTRS)) { into 'config/' }
        from(makeExceptions) { into 'config/' }
        from(file(PATH_TSRG)) { into 'config/' }
        from(dumpStatic) { into 'config/' }

        def patches = file(PATH_VERSION + 'patches')
        if (patches.exists())
            from(patches) { into 'patches/' }

        if (PATH_INJECT != null && PATH_INJECT.exists())
            from(PATH_INJECT) { into 'config/inject/' }
    }

    // --------------------------------------------------------------- publishing
    publishing {
        repositories {
            maven {
                name = 'maven'
                url = rootProject.uri(rootProject.MAVEN_URL)
                if (rootProject.MAVEN_URL.startsWith('http')) {
                    credentials {
                        username = rootProject.MAVEN_USER
                        password = rootProject.MAVEN_PASSWORD
                    }
                }
            }
        }
        publications {
            maven(MavenPublication) {
                groupId = project.group
                artifactId = 'mcp_config'
                version = publishVersion
                artifact mcpZip
                pom {
                    name = 'MCPConfig'
                    description = 'Configuration files used for deobfuscating and modding Minecraft.'
                    url = 'https://github.com/MinecraftForge/MCPConfig'
                    scm {
                        url = 'https://github.com/MinecraftForge/MCPConfig'
                        connection = 'scm:git:git://github.com/MinecraftForge/MCPConfig.git'
                        developerConnection = 'scm:git:git@github.com:MinecraftForge/MCPConfig.git'
                    }
                    issueManagement {
                        system = 'github'
                        url = 'https://github.com/MinecraftForge/MCPConfig/issues'
                    }
                    licenses {
                        license {
                            name = 'All Rights Reserved, No redistribution.'
                            url = ''
                        }
                    }
                }
            }
        }
    }

    tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
        if (rootProject.MAVEN_URL.startsWith('http') && (rootProject.MAVEN_USER == null || rootProject.MAVEN_PASSWORD == null))
            doFirst {
                throw new GradleException("Publishing to ${rootProject.MAVEN_URL} requires credentials: "
                        + '-PmavenUser=<user> -PmavenPassword=<token> (or MAVEN_USER / MAVEN_PASSWORD).')
            }
    }
}
