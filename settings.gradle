rootProject.name = 'mcp_config'

// Every directory under versions/release/ is one mcp_config version project.
// -Pver=1.12.2 restricts the build to a single version.
def versionDir = file('versions/release')

def versions = versionDir.listFiles()
        .findAll { it.directory }
        .collect { it.name }
        .findAll { !hasProperty('ver') || it == getProperty('ver') }
        .sort()

if (hasProperty('ver') && versions.isEmpty())
    throw new GradleException("Unknown version '${getProperty('ver')}', expected one of: "
            + versionDir.listFiles().findAll { it.directory }.collect { it.name }.sort())

versions.each { version ->
    include ":$version"
    project(":$version").projectDir = new File(versionDir, version)
}

println 'Versions: ' + versions
